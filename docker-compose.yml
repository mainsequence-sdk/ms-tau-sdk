services:
  astro:
    build:
      context: .
      dockerfile: Dockerfile
      target: astro
    image: astro:tau
    env_file:
      - .env
    environment:
      PYTHONPATH: /opt/astro-local/src:/opt/astro-local/packages/tau-file-tools/src:/opt/astro-local/packages/tau-web-access/src
      MAINSEQUENCE_BACKEND: ${MAINSEQUENCE_BACKEND:-http://host.docker.internal:8000}
      MAINSEQUENCE_AUTH_MODE: ${MAINSEQUENCE_AUTH_MODE:-runtime_credential}
      MAINSEQUENCE_RUNTIME_CREDENTIAL_ID: ${MAINSEQUENCE_RUNTIME_CREDENTIAL_ID}
      MAINSEQUENCE_RUNTIME_CREDENTIAL_SECRET: ${MAINSEQUENCE_RUNTIME_CREDENTIAL_SECRET}
      ASTRO_HOST: 0.0.0.0
      ASTRO_PORT: 8787
      ASTRO_CODE_REPOSITORY_CWD: /workspace
      ASTRO_HOME: /home/appuser
      ASTRO_A2A_ASSET_ROOT: /tmp/astro-a2a-assets
      ASTRO_SESSION_ASSET_ROOT: /tmp/astro-session-assets
      ASTRO_STARTUP_DEPENDENCIES_ENABLED: ${ASTRO_STARTUP_DEPENDENCIES_ENABLED:-true}
      ASTRO_MCP_READ_CONCURRENCY: ${ASTRO_MCP_READ_CONCURRENCY:-8}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "api.main-sequence.app:host-gateway"
    volumes:
      - ./src:/opt/astro-local/src:ro
      - ./packages/tau-file-tools/src:/opt/astro-local/packages/tau-file-tools/src:ro
      - ./packages/tau-web-access/src:/opt/astro-local/packages/tau-web-access/src:ro
      - ${ASTRO_CODE_REPOSITORY_PATH:-.}:/workspace:rw
    ports:
      - "${ASTRO_PORT:-8787}:8787"
    init: true
    stop_grace_period: 30s
