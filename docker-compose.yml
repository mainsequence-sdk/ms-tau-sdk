services:
  astro-pi:
    profiles:
      - pi-shell
    build:
      context: .
      dockerfile: Dockerfile
      target: astro-pi
      args:
        MAINSEQUENCE_PIP_SPEC: ${MAINSEQUENCE_PIP_SPEC:-mainsequence}
    image: astro:pi
    env_file:
      - .env
    environment:
      HOME: /home/appuser
      ASTRO_CONTAINER_DATA_DIR: /home/appuser/.astro-container-data
      ASTRO_MAINSEQUENCE_CONFIG_DIR: /home/appuser/.astro-container-data/.config/mainsequence
      PI_CODING_AGENT_DIR: /home/appuser/.astro-container-data/.pi/agent
      ASTRO_STREAM_SESSION_DIR: /home/appuser/.astro-container-data/.astro/stream-sessions
      ASTRO_LEGACY_REPO_STATE_DIR: /app/.astro-migration-source
      ASTRO_LEGACY_HOST_PI_AGENT_DIR: /home/appuser/.pi/host-agent
      BUILD_AGENTS_IN_BACKEND: "0"
    volumes:
      - ./.astro:/app/.astro-migration-source:ro
      - ./.pi:/app/.pi
      - ./pi:/app/pi
      - ./interface:/app/interface
      - ./scripts:/app/scripts
      - ./docs:/app/docs
      - ./README.md:/app/README.md
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./tsconfig.json:/app/tsconfig.json
      - ${HOME}/.pi/agent:/home/appuser/.pi/host-agent:ro
      - astro_container_data:/home/appuser/.astro-container-data
    stdin_open: true
    tty: true

  astro-pi-stream:
    build:
      context: .
      dockerfile: Dockerfile
      target: astro-pi-stream
      args:
        MAINSEQUENCE_PIP_SPEC: ${MAINSEQUENCE_PIP_SPEC:-mainsequence}
    image: astro:pi-stream
    env_file:
      - .env
    environment:
      HOME: /home/appuser
      ASTRO_CONTAINER_DATA_DIR: /home/appuser/.astro-container-data
      ASTRO_MAINSEQUENCE_CONFIG_DIR: /home/appuser/.astro-container-data/.config/mainsequence
      PI_CODING_AGENT_DIR: /home/appuser/.astro-container-data/.pi/agent
      ASTRO_STREAM_HOST: 0.0.0.0
      ASTRO_STREAM_PORT: ${ASTRO_STREAM_PORT:-8787}
      ASTRO_STREAM_SESSION_DIR: /home/appuser/.astro-container-data/.astro/stream-sessions
      ASTRO_LEGACY_REPO_STATE_DIR: /app/.astro-migration-source
      ASTRO_LEGACY_HOST_PI_AGENT_DIR: /home/appuser/.pi/host-agent
      BUILD_AGENTS_IN_BACKEND: "1"
    volumes:
      - ./.astro:/app/.astro-migration-source:ro
      - ./.pi:/app/.pi
      - ./pi:/app/pi
      - ./interface:/app/interface
      - ./scripts:/app/scripts
      - ./docs:/app/docs
      - ./README.md:/app/README.md
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./tsconfig.json:/app/tsconfig.json
      - ${HOME}/.pi/agent:/home/appuser/.pi/host-agent:ro
      - astro_container_data:/home/appuser/.astro-container-data
    ports:
      - "${ASTRO_STREAM_PORT:-8787}:8787"

volumes:
  astro_container_data:
