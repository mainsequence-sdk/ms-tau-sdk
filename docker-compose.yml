services:
  astro:
    build:
      context: .
      dockerfile: Dockerfile
      target: astro
    image: astro:tau
    env_file:
      - .env
    environment:
      MAINSEQUENCE_BACKEND: ${MAINSEQUENCE_BACKEND:-http://api.main-sequence.app:8000}
      MAINSEQUENCE_AUTH_MODE: ${MAINSEQUENCE_AUTH_MODE:-runtime_credential}
      MAINSEQUENCE_RUNTIME_CREDENTIAL_ID: ${MAINSEQUENCE_RUNTIME_CREDENTIAL_ID}
      MAINSEQUENCE_RUNTIME_CREDENTIAL_SECRET: ${MAINSEQUENCE_RUNTIME_CREDENTIAL_SECRET}
      ASTRO_HOST: 0.0.0.0
      ASTRO_PORT: 8787
      ASTRO_PROJECT_CWD: /workspace
      ASTRO_HOME: /home/jovyan
      ASTRO_A2A_ASSET_ROOT: /tmp/astro-a2a-assets
      ASTRO_SESSION_ASSET_ROOT: /tmp/astro-session-assets
      ASTRO_TAU_RUNTIME_CONTRACT: ${ASTRO_TAU_RUNTIME_CONTRACT:-v1}
      ASTRO_STARTUP_DEPENDENCIES_ENABLED: ${ASTRO_STARTUP_DEPENDENCIES_ENABLED:-true}
      ASTRO_MCP_READ_CONCURRENCY: ${ASTRO_MCP_READ_CONCURRENCY:-8}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "api.main-sequence.app:host-gateway"
    volumes:
      - ${ASTRO_PROJECT_PATH:-.}:/workspace:rw
    ports:
      - "${ASTRO_PORT:-8787}:8787"
    init: true
    stop_grace_period: 30s
