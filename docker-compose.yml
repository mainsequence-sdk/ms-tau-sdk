  astro-session-checkpoint-sidecar:
    build:
      context: .
      dockerfile: Dockerfile
      target: astro-session-checkpoint-sidecar
      args:
        MAINSEQUENCE_PIP_SPEC: ${MAINSEQUENCE_PIP_SPEC:-mainsequence}
    image: astro:session-checkpoint-sidecar
    env_file:
      - .env
    environment:
      HOME: /home/appuser
      ASTRO_CONTAINER_DATA_DIR: /home/appuser/.astro-container-data
      ASTRO_MAINSEQUENCE_CONFIG_DIR: /home/appuser/.astro-container-data/.config/mainsequence
      PI_CODING_AGENT_DIR: /home/appuser/.astro-container-data/.pi/agent
      ASTRO_SESSION_STATE_DIR: /session-state
      ASTRO_STREAM_SESSION_DIR: /session-state/sessions
      ASTRO_SESSION_OVERRIDES_DIR: /session-state/session-overrides
      ASTRO_PROVIDER_CREDENTIAL_DIR: /session-state/pi-agent-auth
      ASTRO_CHECKPOINT_HOLDER_ID: pod/local-compose-astro-pi-stream
      ASTRO_CHECKPOINT_SIDECAR_DEBOUNCE_MS: ${ASTRO_CHECKPOINT_SIDECAR_DEBOUNCE_MS:-1000}
      ASTRO_CHECKPOINT_SIDECAR_SCAN_INTERVAL_MS: ${ASTRO_CHECKPOINT_SIDECAR_SCAN_INTERVAL_MS:-10000}
      ASTRO_CHECKPOINT_SIDECAR_PERIODIC_FLUSH_MS: ${ASTRO_CHECKPOINT_SIDECAR_PERIODIC_FLUSH_MS:-30000}
      ASTRO_CHECKPOINT_SIDECAR_METRICS_INTERVAL_MS: ${ASTRO_CHECKPOINT_SIDECAR_METRICS_INTERVAL_MS:-60000}
    volumes:
      - ./pi:/app/pi
      - ./interface:/app/interface
      - ./scripts:/app/scripts
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./tsconfig.json:/app/tsconfig.json
      - astro_session_emptydir:/session-state
    depends_on:
      - astro-pi-stream

