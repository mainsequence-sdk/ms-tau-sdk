[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ms-tau-board"
version = "0.1.0"
description = "Small local development board for Main Sequence Tau"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "starlette>=1.3,<2",
  "uvicorn>=0.51,<1",
  "httpx>=0.28,<1",
]

[project.scripts]
tau-board = "ms_tau_board.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ms_tau_board"]

[tool.hatch.build.targets.sdist]
include = ["/README.md", "/pyproject.toml", "/src/ms_tau_board", "/tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
