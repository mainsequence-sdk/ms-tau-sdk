[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tau-web-access"
version = "0.1.0"
description = "Web search and content extraction tools for Tau agents"
requires-python = ">=3.13"
dependencies = [
  "beautifulsoup4>=4.13",
  "httpx>=0.28",
  "markdownify>=1.2",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "pypdf>=5.8",
  "tau-ai==0.3.1",
  "youtube-transcript-api>=1.2",
  "yt-dlp>=2025.6.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "respx>=0.22",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tau_web_access"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
