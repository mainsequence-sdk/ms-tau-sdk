[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ms-tau-sdk"
version = "0.1.0"
description = "Workspace-bound Tau application primitives for Main Sequence projects"
requires-python = ">=3.13"
dependencies = [
  "anyio>=4.10",
  "fastapi>=0.116",
  "httpx>=0.28",
  "jsonschema>=4.25,<5",
  "mcp>=1.27,<2",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "pypdf>=6.0,<7",
  "python-multipart>=0.0.20",
  "structlog>=26.1,<27",
  "tau-ai==0.4.2",
  "uvicorn[standard]>=0.35",
]

[project.scripts]
ms-tau = "ms_tau_sdk.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "pytest-cov>=7.1.0",
  "pytest-timeout>=2.4.0",
  "respx>=0.22",
  "ruff>=0.12",
  "types-jsonschema>=4.26.0.20260518",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ms_tau_sdk"]

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
  "--strict-config",
  "--strict-markers",
  "--timeout=10",
]
asyncio_mode = "auto"
testpaths = [
  "tests",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = [
  "src/ms_tau_sdk",
]

[tool.coverage.run]
branch = true
source = ["ms_tau_sdk"]

[tool.coverage.report]
fail_under = 74
show_missing = true
skip_covered = true
