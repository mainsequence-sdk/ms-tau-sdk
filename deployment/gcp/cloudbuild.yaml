steps:
  - id: "upload-project-executor-dockerfile"
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        gsutil cp Dockerfile.remote-worker \
          "gs://workload-default-${PROJECT_ID}/pod-dockerfiles/project_executor/Dockerfile"

  - id: "build-and-tag"
    name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail

        export DOCKER_BUILDKIT=1

        ASTRO_VERSION="$$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n1)"
        test -n "$${ASTRO_VERSION}"

        LOCAL_IMAGE="astro-tau:build-${BUILD_ID}"
        LOCAL_BUNDLE_IMAGE="project-executor-bundle:build-${BUILD_ID}"
        VERSION_IMAGE="${_IMAGE_PREFIX}:astro-$${ASTRO_VERSION}"
        BUNDLE_VERSION_IMAGE="${_BUNDLE_IMAGE_PREFIX}:astro-$${ASTRO_VERSION}"

        docker build \
          -f Dockerfile \
          --target astro \
          --build-arg "ASTRO_RELEASE_VERSION=$${ASTRO_VERSION}" \
          -t "$${LOCAL_IMAGE}" \
          .
        docker build \
          -f Dockerfile \
          --target project-executor-bundle \
          --build-arg "ASTRO_RELEASE_VERSION=$${ASTRO_VERSION}" \
          -t "$${LOCAL_BUNDLE_IMAGE}" \
          .

        PYTHON_VERSION_FULL="$$(docker run --rm --entrypoint python "$${LOCAL_IMAGE}" \
          -c "import platform; print(platform.python_version())")"
        PYTHON_VERSION_TAG="$$(docker run --rm --entrypoint python "$${LOCAL_IMAGE}" \
          -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")"

        PYTHON_IMAGE="${_IMAGE_PREFIX}:python-$${PYTHON_VERSION_TAG}"

        printf '%s' "$${VERSION_IMAGE}" > /workspace/version_image.txt
        printf '%s' "$${PYTHON_IMAGE}" > /workspace/python_image.txt
        printf '%s' "$${BUNDLE_VERSION_IMAGE}" > /workspace/bundle_version_image.txt

        docker tag "$${LOCAL_IMAGE}" "$${VERSION_IMAGE}"
        docker tag "$${LOCAL_IMAGE}" "$${PYTHON_IMAGE}"
        docker tag "$${LOCAL_IMAGE}" "${_LATEST_IMAGE}"
        docker tag "$${LOCAL_BUNDLE_IMAGE}" "$${BUNDLE_VERSION_IMAGE}"
        docker tag "$${LOCAL_BUNDLE_IMAGE}" "${_BUNDLE_LATEST_IMAGE}"

        echo "Astro $${ASTRO_VERSION}; Python $${PYTHON_VERSION_FULL}"

  - id: "push-version"
    waitFor: ["build-and-tag"]
    name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args: ["-c", "docker push \"$$(cat /workspace/version_image.txt)\""]

  - id: "push-latest"
    waitFor: ["build-and-tag"]
    name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_LATEST_IMAGE}"]

  - id: "push-python-runtime"
    waitFor: ["build-and-tag"]
    name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args: ["-c", "docker push \"$$(cat /workspace/python_image.txt)\""]

  - id: "push-bundle-version"
    waitFor: ["build-and-tag"]
    name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args: ["-c", "docker push \"$$(cat /workspace/bundle_version_image.txt)\""]

  - id: "push-bundle-latest"
    waitFor: ["build-and-tag"]
    name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_BUNDLE_LATEST_IMAGE}"]

substitutions:
  _AR_REGION: "europe-west1"
  _AR_REPO: "workload-default-artifact-registry"
  _IMAGE_NAME: "astro/astro-tau"
  _BUNDLE_IMAGE_NAME: "astro/project-executor-bundle"
  _IMAGE_PREFIX: "${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}"
  _BUNDLE_IMAGE_PREFIX: "${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_BUNDLE_IMAGE_NAME}"
  _LATEST_IMAGE: "${_IMAGE_PREFIX}:latest"
  _BUNDLE_LATEST_IMAGE: "${_BUNDLE_IMAGE_PREFIX}:latest"

options:
  dynamicSubstitutions: true
  logging: "CLOUD_LOGGING_ONLY"
