name: Quality

on:
  pull_request:
  push:
    branches:
      - development
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.13
      - name: Sync locked workspace
        run: uv sync --frozen
      - name: Install runtime tool dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - name: Check formatting
        run: uv run ruff format --check src tests
      - name: Lint
        run: uv run ruff check src tests
      - name: Type check
        run: uv run mypy
      - name: Verify locked SDK consumer project
        working-directory: tests/fixtures/sdk-consumer-project
        env:
          MAINSEQUENCE_TAU_STARTUP_DEPENDENCIES_ENABLED: "false"
        run: |
          uv sync --frozen
          uv run --frozen python -c 'from api.tau.main import app; assert app.title == "Main Sequence TAU SDK"'
      - name: Test with branch coverage
        run: >-
          uv run pytest
          --cov=ms_tau_sdk
          --cov-branch
          --cov-report=term-missing:skip-covered
