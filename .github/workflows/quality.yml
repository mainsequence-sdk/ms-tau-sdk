name: Quality

on:
  pull_request:
  push:
    branches:
      - development
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up patched Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.17"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.4"
          enable-cache: true
      - name: Sync locked workspace
        run: uv sync --frozen --extra tau-board
      - name: Install runtime tool dependencies
        # ripgrep comes from its GitHub release, checksum pinned, not apt: Ubuntu's package mirrors
        # are not reachable from every runner, and when they are not, nothing is tested or published.
        env:
          RIPGREP_VERSION: "15.1.0"
          RIPGREP_SHA256: 1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
        run: |
          archive="ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/$archive.tar.gz"
          echo "$RIPGREP_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/$archive/rg" /usr/local/bin/rg
          rg --version
      - name: Check formatting
        run: uv run ruff format --check src tests scripts packages/tau-board/src packages/tau-board/tests
      - name: Lint
        run: uv run ruff check src tests scripts packages/tau-board
      - name: Type check
        run: |
          uv run mypy
          uv run mypy --strict packages/tau-board/src/ms_tau_board
      - name: Verify board UI syntax
        run: node --check packages/tau-board/src/ms_tau_board/static/app.js
      - name: Build and inspect SDK with Tau Board
        run: |
          uv build --no-sources --out-dir release-dist
          uv run python scripts/verify_distribution.py \
            --dist-dir release-dist \
            --require-clean-source \
            --write-release-metadata
      - name: Verify clean wheel installation
        run: uv run python scripts/verify_clean_install.py release-dist/ms_tau_sdk-*.whl
      - name: Verify locked SDK consumer project
        working-directory: tests/fixtures/sdk-consumer-project
        env:
          MAINSEQUENCE_TAU_STARTUP_DEPENDENCIES_ENABLED: "false"
        run: |
          uv sync --frozen
          uv run --frozen python -c 'from api.tau.main import app; assert app.title == "Main Sequence TAU SDK"'
      - name: Test with branch coverage
        run: >-
          uv run pytest
          --cov=ms_tau_sdk
          --cov-branch
          --cov-report=term-missing:skip-covered
      - name: Test Tau Board
        run: uv run pytest packages/tau-board/tests -q
