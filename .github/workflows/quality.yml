name: Quality

on:
  pull_request:
  push:
    branches:
      - development
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.13
      - name: Sync locked workspace
        run: uv sync --frozen --extra tau-board
      - name: Install runtime tool dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - name: Check formatting
        run: uv run ruff format --check src tests scripts packages/tau-board/src packages/tau-board/tests packages/tau-board/scripts
      - name: Lint
        run: uv run ruff check src tests scripts packages/tau-board
      - name: Type check
        run: |
          uv run mypy
          uv run mypy --strict packages/tau-board/src/ms_tau_board
      - name: Verify board UI syntax
        run: node --check packages/tau-board/src/ms_tau_board/static/app.js
      - name: Build and inspect distributions
        run: |
          uv build --no-sources --out-dir release-dist
          uv run python scripts/verify_distribution.py \
            --dist-dir release-dist \
            --require-clean-source \
            --write-release-metadata
          uv build --no-sources packages/tau-board --out-dir board-dist
          uv run python packages/tau-board/scripts/verify_distribution.py board-dist
      - name: Verify clean wheel installation
        run: uv run python scripts/verify_clean_install.py release-dist/ms_tau_sdk-*.whl
      - name: Verify locked SDK consumer project
        working-directory: tests/fixtures/sdk-consumer-project
        env:
          MAINSEQUENCE_TAU_STARTUP_DEPENDENCIES_ENABLED: "false"
        run: |
          uv sync --frozen
          uv run --frozen python -c 'from api.tau.main import app; assert app.title == "Main Sequence TAU SDK"'
      - name: Test with branch coverage
        run: >-
          uv run pytest
          --cov=ms_tau_sdk
          --cov-branch
          --cov-report=term-missing:skip-covered
      - name: Test Tau Board
        run: uv run pytest packages/tau-board/tests -q
