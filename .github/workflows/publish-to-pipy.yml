# Build, verify, and publish a final ms-tau-sdk release to PyPI when `development` is merged into
# `main`. A merge to `main` is the release: `main` only changes through a pull request, so every
# push to it publishes the version pyproject.toml declares, is tagged vX.Y.Z by this workflow, and
# raises the patch number on `development`. A tag pushed by hand publishes nothing.
# Pushes to `development` publish X.Y.Z.devN through publish-development-release.yml instead.
# PyPI authentication uses GitHub OIDC trusted publishing; no API token is stored.
name: Publish Python package to PyPI

on:
  push:
    branches:
      - main

# Two merges in a row release one after the other, never at the same time.
concurrency:
  group: publish-to-pypi
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Python
        run: uv python install 3.13

      - name: Sync locked workspace
        run: uv sync --frozen

      # pyproject.toml is the only source of the version. A merge that still declares a version
      # PyPI has cannot be released, so it stops here instead of failing at upload as a duplicate.
      - name: Read the version this merge releases
        id: release-version
        run: |
          uv run --no-project --python 3.13 python scripts/compute_development_version.py \
            --final --github-output

      # A tag vX.Y.Z on another commit would make the release tag name code that was not
      # published, so it is refused before anything is built.
      - name: Refuse a tag that already names another commit
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: v${{ steps.release-version.outputs.version }}
        run: |
          tagged="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" | tail -n 1 | cut -f 1)"
          if [ -n "$tagged" ] && [ "$tagged" != "$RELEASE_SHA" ]; then
            echo "::error::$RELEASE_TAG already exists and points at $tagged, not at the merge $RELEASE_SHA."
            echo "::error::Delete the tag or declare another version."
            exit 1
          fi

      - name: Require the changelog to be headed by the released version
        env:
          RELEASE_TAG: v${{ steps.release-version.outputs.version }}
        run: |
          uv run python -c \
            'import os, pathlib, re; heads = [h for h in re.findall(r"^## (\S+)", pathlib.Path("CHANGELOG.md").read_text(), flags=re.M) if h != "Unreleased"]; assert heads[:1] == [os.environ["RELEASE_TAG"].removeprefix("v")], (os.environ["RELEASE_TAG"], heads[:1])'

      - name: Require published Tau Board for the SDK extra
        run: uv run --no-project --with 'ms-tau-board>=0.1,<0.2' python -c 'import ms_tau_board'

      - name: Build and inspect distributions
        run: |
          uv build --no-sources --out-dir release-dist
          uv run python scripts/verify_distribution.py \
            --dist-dir release-dist \
            --require-clean-source \
            --write-release-metadata

      - name: Verify clean wheel installation
        run: uv run python scripts/verify_clean_install.py release-dist/ms_tau_sdk-*.whl

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            release-dist/*.whl
            release-dist/*.tar.gz

      - name: Upload package distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: python-package-distributions
          path: |
            release-dist/*.whl
            release-dist/*.tar.gz
          retention-days: 7

      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: ms-tau-sdk-v${{ steps.release-version.outputs.version }}
          path: release-dist/*

  publish-to-pypi:
    name: Publish to PyPI
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ms-tau-sdk
    permissions:
      id-token: write
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  # The tag and the GitHub release are made after the upload, so a tag vX.Y.Z always names code
  # that is on PyPI. The ruleset "release tags v*" has to list GitHub Actions as a bypass actor;
  # see docs/reference/releasing.md.
  tag:
    name: Tag the merge and create the GitHub release
    needs: [build-and-verify, publish-to-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the merge and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.build-and-verify.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; nothing to create."
            exit 0
          fi
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes

  open-next-version:
    # pyproject.toml is the only source of the version. Once X.Y.Z is released, `development` has to
    # declare the next release, or its development builds would be refused as already released.
    name: Declare the next version on development
    needs: [build-and-verify, publish-to-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out development
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: development
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # `development` receives the release merge and the next version in one push made with the
      # workflow token, which starts no development release. A push by hand in between would
      # publish one more X.Y.Z.devN.
      - name: Bring the release merge into development and raise the patch number
        env:
          RELEASED: ${{ needs.build-and-verify.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit "$GITHUB_SHA"
          declared="$(uv run --no-project --python 3.13 python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$declared" != "$RELEASED" ]; then
            echo "development declares $declared, not the released $RELEASED; nothing to raise"
          else
            next="$(uv run --no-project --python 3.13 python scripts/compute_development_version.py --bump-patch)"
            uv lock
            git add -- pyproject.toml uv.lock
            git commit -m "Declare $next as the next release after $RELEASED"
          fi
          git push origin HEAD:development
