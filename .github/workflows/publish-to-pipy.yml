# Build, verify, and publish a final ms-tau-sdk release to PyPI from an exact version tag on main.
# Pushes to `development` publish X.Y.Z.devN through publish-development-release.yml instead.
# PyPI authentication uses GitHub OIDC trusted publishing; no API token is stored.
name: Publish Python package to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the release tag to be contained in main
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main; then
            echo "::error::$RELEASE_TAG ($RELEASE_SHA) is not contained in main."
            echo "::error::Final releases are tagged on main; development publishes X.Y.Z.devN."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Python
        run: uv python install 3.13

      - name: Sync locked workspace
        run: uv sync --frozen

      - name: Require tag to match package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run python -c \
            'import os, pathlib, tomllib; version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]; assert os.environ["RELEASE_TAG"] == f"v{version}", (os.environ["RELEASE_TAG"], version)'

      - name: Require the changelog to be headed by the released version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run python -c \
            'import os, pathlib, re; heads = [h for h in re.findall(r"^## (\S+)", pathlib.Path("CHANGELOG.md").read_text(), flags=re.M) if h != "Unreleased"]; assert heads[:1] == [os.environ["RELEASE_TAG"].removeprefix("v")], (os.environ["RELEASE_TAG"], heads[:1])'

      - name: Build and inspect distributions
        run: |
          uv build --no-sources --out-dir release-dist
          uv run python scripts/verify_distribution.py \
            --dist-dir release-dist \
            --require-clean-source \
            --write-release-metadata

      - name: Verify clean wheel installation
        run: uv run python scripts/verify_clean_install.py release-dist/ms_tau_sdk-*.whl

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            release-dist/*.whl
            release-dist/*.tar.gz

      - name: Upload package distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: python-package-distributions
          path: |
            release-dist/*.whl
            release-dist/*.tar.gz
          retention-days: 7

      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: ms-tau-sdk-${{ github.ref_name }}
          path: release-dist/*

  publish-to-pypi:
    name: Publish to PyPI
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ms-tau-sdk
    permissions:
      id-token: write
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  open-next-version:
    # pyproject.toml is the only source of the version. Once X.Y.Z is released, `development` has to
    # declare the next release, or its development builds would be refused as already released.
    name: Declare the next version on development
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out development
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: development
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Raise the patch number when development still declares the released version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          declared="$(uv run --no-project --python 3.13 python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "v$declared" != "$RELEASE_TAG" ]; then
            echo "development declares $declared, not the released ${RELEASE_TAG#v}; nothing to raise"
            exit 0
          fi
          next="$(uv run --no-project --python 3.13 python scripts/compute_development_version.py --bump-patch)"
          uv lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pyproject.toml uv.lock
          git commit -m "Declare $next as the next release after ${RELEASE_TAG#v}"
          git push origin HEAD:development
