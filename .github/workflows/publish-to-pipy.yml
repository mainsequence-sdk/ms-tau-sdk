# Build, verify, and publish ms-tau-sdk to PyPI from an exact version tag.
# PyPI authentication uses GitHub OIDC trusted publishing; no API token is stored.
name: Publish Python package to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Python
        run: uv python install 3.13

      - name: Sync locked workspace
        run: uv sync --frozen

      - name: Require tag to match package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run python -c \
            'import os, pathlib, tomllib; version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]; assert os.environ["RELEASE_TAG"] == f"v{version}", (os.environ["RELEASE_TAG"], version)'

      - name: Build and inspect distributions
        run: |
          uv build --no-sources --out-dir release-dist
          uv run python scripts/verify_distribution.py \
            --dist-dir release-dist \
            --require-clean-source \
            --write-release-metadata

      - name: Verify clean wheel installation
        run: uv run python scripts/verify_clean_install.py release-dist/ms_tau_sdk-*.whl

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            release-dist/*.whl
            release-dist/*.tar.gz

      - name: Upload package distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: python-package-distributions
          path: |
            release-dist/*.whl
            release-dist/*.tar.gz
          retention-days: 7

      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: ms-tau-sdk-${{ github.ref_name }}
          path: release-dist/*

  publish-to-pypi:
    name: Publish to PyPI
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ms-tau-sdk
    permissions:
      id-token: write
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
